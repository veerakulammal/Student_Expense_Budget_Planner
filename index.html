```html
<!DOCTYPE html>
<html>
<head>
    <title>Student Expense & Budget Planner</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .box {
            background: #eef2ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .expense {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .delete {
            width: auto;
            background: #dc2626;
            padding: 6px 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Expense & Budget Planner</h1>

    <!-- Budget -->
    <div class="card">

        <h2>💰 Monthly Budget</h2>

        <input
            type="number"
            id="budget"
            placeholder="Enter your budget"
        >

        <button onclick="setBudget()">
            Set Budget
        </button>

    </div>


    <!-- Summary -->
    <div class="card">

        <h2>📊 Summary</h2>

        <div class="summary">

            <div class="box">
                <b>Budget</b>
                <h3 id="budgetText">₹0</h3>
            </div>

            <div class="box">
                <b>Spent</b>
                <h3 id="spentText">₹0</h3>
            </div>

            <div class="box">
                <b>Remaining</b>
                <h3 id="remainingText">₹0</h3>
            </div>

            <div class="box">
                <b>Expenses</b>
                <h3 id="countText">0</h3>
            </div>

        </div>

    </div>


    <!-- Add Expense -->
    <div class="card">

        <h2>➕ Add Expense</h2>

        <input
            type="text"
            id="name"
            placeholder="Expense name"
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount"
        >

        <select id="category">

            <option>Food</option>
            <option>Transport</option>
            <option>Education</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>Hostel</option>
            <option>Other</option>

        </select>

        <button onclick="addExpense()">
            Add Expense
        </button>

    </div>


    <!-- Expenses -->
    <div class="card">

        <h2>🧾 My Expenses</h2>

        <div id="expenses"></div>

    </div>

</div>


<script>

let budget = Number(localStorage.getItem("budget")) || 0;

let expenses =
    JSON.parse(localStorage.getItem("expenses")) || [];


function saveData() {

    localStorage.setItem(
        "budget",
        budget
    );

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

}


function setBudget() {

    budget =
        Number(
            document.getElementById("budget").value
        );

    saveData();

    display();

}


function addExpense() {

    let name =
        document.getElementById("name").value;

    let amount =
        Number(
            document.getElementById("amount").value
        );

    let category =
        document.getElementById("category").value;


    if (name === "" || amount <= 0) {

        alert("Please enter valid details!");

        return;

    }


    expenses.push({

        name: name,
        amount: amount,
        category: category

    });


    saveData();


    document.getElementById("name").value = "";

    document.getElementById("amount").value = "";


    display();

}


function deleteExpense(index) {

    expenses.splice(index, 1);

    saveData();

    display();

}


function display() {

    let total = 0;

    let html = "";


    expenses.forEach((expense, index) => {

        total += expense.amount;


        html += `

        <div class="expense">

            <div>
                <b>${expense.name}</b><br>
                ${expense.category}
            </div>

            <div>
                ₹${expense.amount}

                <button
                    class="delete"
                    onclick="deleteExpense(${index})"
                >
                    Delete
                </button>

            </div>

        </div>

        `;

    });


    document.getElementById("expenses")
        .innerHTML = html;


    document.getElementById("budgetText")
        .innerText = "₹" + budget;


    document.getElementById("spentText")
        .innerText = "₹" + total;


    document.getElementById("remainingText")
        .innerText = "₹" + (budget - total);


    document.getElementById("countText")
        .innerText = expenses.length;

}


display();

</script>

</body>
</html>
```
